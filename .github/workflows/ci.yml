name: GuardBoard quality and Linux package
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements-dev.txt
      - run: .venv/bin/python -m pytest -q
      - run: node --check frontend/js/app.js
  build:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements-build.txt
      - run: ./scripts/build_linux.sh
      - run: .venv/bin/python scripts/smoke_package.py
      - run: cd dist/packages && sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: guardboard-linux-${{ github.sha }}
          path: dist/packages/*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: guardboard-linux-${{ github.sha }}
          path: release
      - run: cd release && sha256sum -c SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          name: GuardBoard ${{ github.ref_name }} development preview
          body_path: docs/RELEASE_NOTES.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: release/*
