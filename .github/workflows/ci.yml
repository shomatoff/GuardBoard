name: Desktop builds

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            platform: Linux
            package: dist/packages/GuardBoard-Linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements-build.txt
      - run: ./scripts/build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: GuardBoard-${{ matrix.platform }}-x64
          path: |
            ${{ matrix.package }}
            dist/packages/SHA256SUMS
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: GuardBoard-Linux-x64
          path: packages
      - uses: softprops/action-gh-release@v2
        with:
          name: GuardBoard ${{ github.ref_name }}
          body_path: docs/RELEASE_NOTES.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: packages/*
